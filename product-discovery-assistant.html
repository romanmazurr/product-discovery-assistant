<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Discovery Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #141417;
    --surface2: #1c1c21;
    --border: #2a2a32;
    --accent: #e8ff47;
    --accent2: #ff6b35;
    --text: #f0f0f0;
    --muted: #6b6b7a;
    --success: #4ade80;
    --warning: #fbbf24;
    --danger: #f87171;
  }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: 0.6;
  }

  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
    position: sticky; top: 0; z-index: 10;
    background: rgba(13,13,15,0.9);
    backdrop-filter: blur(12px);
  }

  .logo-mark {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: grid; place-items: center;
    font-family: 'Syne', sans-serif;
    font-weight: 800; color: #000;
    font-size: 18px; flex-shrink: 0;
  }

  .logo-text {
    font-family: 'Syne', sans-serif;
    font-weight: 700; font-size: 15px;
    letter-spacing: -0.02em;
  }
  .logo-text span { color: var(--accent); }

  .badge {
    margin-left: auto;
    background: rgba(232,255,71,0.08);
    border: 1px solid rgba(232,255,71,0.25);
    color: var(--accent);
    font-size: 10px; letter-spacing: 0.12em;
    padding: 4px 10px; border-radius: 99px;
    text-transform: uppercase;
  }

  .layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    flex: 1;
    position: relative; z-index: 1;
  }

  .sidebar {
    border-right: 1px solid var(--border);
    padding: 24px 20px;
    display: flex; flex-direction: column; gap: 8px;
    overflow-y: auto;
  }

  .sidebar-label {
    font-size: 10px; letter-spacing: 0.14em;
    color: var(--muted); text-transform: uppercase;
    margin-bottom: 4px; padding: 0 4px;
  }

  .mode-btn {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 10px;
    border: 1px solid transparent;
    background: none; cursor: pointer;
    text-align: left; width: 100%;
    transition: all 0.15s ease;
    color: var(--muted);
  }
  .mode-btn:hover { background: var(--surface2); color: var(--text); }
  .mode-btn.active {
    background: var(--surface2);
    border-color: var(--border);
    color: var(--text);
  }
  .mode-btn.active .mode-icon { background: var(--accent); color: #000; }

  .mode-icon {
    width: 32px; height: 32px; border-radius: 8px;
    display: grid; place-items: center; font-size: 15px;
    background: var(--surface); flex-shrink: 0;
    transition: all 0.15s;
  }

  .mode-info { flex: 1; }
  .mode-name { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; }
  .mode-desc { font-size: 10px; color: var(--muted); margin-top: 2px; line-height: 1.4; }

  .sidebar-divider { height: 1px; background: var(--border); margin: 8px 0; }

  .main {
    display: flex; flex-direction: column; overflow: hidden;
  }

  .chat-area {
    flex: 1; overflow-y: auto;
    padding: 32px 40px;
    display: flex; flex-direction: column; gap: 24px;
  }

  .welcome {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 60vh; gap: 20px; text-align: center;
  }

  .welcome-eyebrow {
    font-size: 10px; letter-spacing: 0.18em;
    color: var(--accent); text-transform: uppercase;
  }

  .welcome-title {
    font-family: 'Syne', sans-serif;
    font-size: 36px; font-weight: 800;
    line-height: 1.1; letter-spacing: -0.03em;
  }
  .welcome-title .highlight { color: var(--accent); }

  .welcome-sub {
    color: var(--muted); font-size: 14px; max-width: 480px; line-height: 1.7;
  }

  .msg { display: flex; flex-direction: column; gap: 4px; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .msg-role {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
  }
  .msg.user .msg-role { color: var(--accent); }

  .msg-bubble {
    padding: 16px 18px; border-radius: 12px;
    font-size: 13px; line-height: 1.75;
    max-width: 800px;
  }
  .msg.user .msg-bubble {
    background: rgba(232,255,71,0.06);
    border: 1px solid rgba(232,255,71,0.15);
    align-self: flex-end;
    color: var(--text);
  }
  .msg.assistant .msg-bubble {
    background: var(--surface);
    border: 1px solid var(--border);
  }

  .block-title {
    font-family: 'Syne', sans-serif;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--accent); margin-bottom: 8px;
    display: flex; align-items: center;
  }
  .block-title::before {
    content: ''; display: inline-block;
    width: 3px; height: 14px;
    background: var(--accent); margin-right: 8px;
    border-radius: 2px;
  }

  .tag {
    font-size: 10px; padding: 3px 10px; border-radius: 99px;
    border: 1px solid; letter-spacing: 0.06em;
  }
  .tag.desirability { color: #60a5fa; border-color: rgba(96,165,250,0.3); background: rgba(96,165,250,0.06); }
  .tag.viability { color: #fbbf24; border-color: rgba(251,191,36,0.3); background: rgba(251,191,36,0.06); }
  .tag.feasibility { color: #f87171; border-color: rgba(248,113,113,0.3); background: rgba(248,113,113,0.06); }

  .list-item {
    display: flex; gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px; line-height: 1.6;
  }
  .list-item:last-child { border-bottom: none; }
  .list-num {
    font-family: 'Syne', sans-serif; font-weight: 700;
    color: var(--accent); min-width: 18px; font-size: 12px;
  }

  .typing-indicator {
    display: flex; align-items: center; gap: 5px;
    padding: 14px 18px;
  }
  .typing-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); opacity: 0.5;
    animation: blink 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1); }
  }

  .input-area {
    border-top: 1px solid var(--border);
    padding: 16px 40px 24px;
    background: rgba(13,13,15,0.95);
    backdrop-filter: blur(12px);
  }

  .input-wrapper {
    display: flex; gap: 12px; align-items: flex-end;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 16px;
    transition: border-color 0.2s;
  }
  .input-wrapper:focus-within { border-color: rgba(232,255,71,0.4); }

  #user-input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: 'DM Mono', monospace;
    font-size: 13px; resize: none; line-height: 1.6;
    max-height: 140px; min-height: 24px;
  }
  #user-input::placeholder { color: var(--muted); }

  .send-btn {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--accent); border: none; cursor: pointer;
    display: grid; place-items: center; flex-shrink: 0;
    transition: all 0.15s; color: #000; font-size: 16px;
  }
  .send-btn:hover { background: #d4eb30; transform: scale(1.05); }
  .send-btn:disabled { background: var(--surface2); cursor: not-allowed; transform: none; color: var(--muted); }

  .input-hint {
    font-size: 10px; color: var(--muted); margin-top: 8px; text-align: center;
    letter-spacing: 0.04em;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .api-key-wrapper {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
  }
  .api-key-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    width: 220px;
    outline: none;
    transition: border-color 0.2s;
  }
  .api-key-input:focus { border-color: rgba(232,255,71,0.4); }
  .api-key-input::placeholder { color: var(--muted); }
  .api-key-label {
    font-size: 10px; color: var(--muted);
    letter-spacing: 0.08em; white-space: nowrap;
  }
  .api-key-status {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0;
    transition: background 0.2s;
  }
  .api-key-status.ok { background: var(--success); }
  .api-key-status.err { background: var(--danger); }

  .error-banner {
    background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.25);
    color: #fca5a5;
    border-radius: 10px; padding: 12px 16px;
    font-size: 12px; line-height: 1.6;
  }
  .error-banner a { color: var(--accent); text-decoration: underline; }

  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .chat-area { padding: 20px; }
    .input-area { padding: 12px 16px 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-mark">D</div>
  <div class="logo-text">Product <span>Discovery</span> Assistant</div>
  <div class="api-key-wrapper">
    <span class="api-key-label">API KEY</span>
    <div class="api-key-status" id="key-status"></div>
    <input class="api-key-input" id="api-key-input" type="password" placeholder="AIza..." oninput="onKeyInput()" />
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-label">Mode</div>

    <button class="mode-btn active" data-mode="quick-check" onclick="setMode(this)">
      <div class="mode-icon">⚡</div>
      <div class="mode-info">
        <div class="mode-name">Quick Check</div>
        <div class="mode-desc">Assumptions, questions & MVP test</div>
      </div>
    </button>

    <button class="mode-btn" data-mode="interview-guide" onclick="setMode(this)">
      <div class="mode-icon">🎙️</div>
      <div class="mode-info">
        <div class="mode-name">Interview Guide</div>
        <div class="mode-desc">Full structured interview script</div>
      </div>
    </button>


    <button class="mode-btn" data-mode="free" onclick="setMode(this)">
      <div class="mode-icon">💬</div>
      <div class="mode-info">
        <div class="mode-name">Open Chat</div>
        <div class="mode-desc">Coaching grounded in Lenny's Podcast</div>
      </div>
    </button>

    <div class="sidebar-divider"></div>
    <div class="sidebar-label">Actions</div>
    <button class="mode-btn" onclick="clearChat()">
      <div class="mode-icon">🗑️</div>
      <div class="mode-info">
        <div class="mode-name">Clear Chat</div>
        <div class="mode-desc">Start a fresh session</div>
      </div>
    </button>
  </aside>

  <div class="main">
    <div class="chat-area" id="chat-area">
      <div class="welcome" id="welcome">
        <div class="welcome-eyebrow">Product Discovery Assistant</div>
        <div class="welcome-title">Stop building features<br><span class="highlight">nobody wants.</span></div>
        <div class="welcome-sub">
          Your Critical Friend for rigorous product discovery. Ground ideas in evidence using JTBD, Lean Discovery, and the Mom Test.
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="user-input" rows="1" placeholder="Describe your feature idea, problem, or ask for an interview guide…" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send">→</button>
      </div>
      <div class="input-hint">Enter to send · Shift+Enter for new line</div>
    </div>
  </div>
</div>

<script>
let currentMode = 'quick-check';
let conversationHistory = [];
let isLoading = false;
let resolvedModel = null;
let lastKeyUsedForModel = null;

// Preference order: newer/better models first
const MODEL_PREFERENCE = [
  'gemini-2.5', 'gemini-2.0', 'gemini-1.5-pro', 'gemini-1.5', 'gemini-1.0-pro', 'gemini'
];

function scoreModel(name) {
  for (let i = 0; i < MODEL_PREFERENCE.length; i++) {
    if (name.includes(MODEL_PREFERENCE[i])) return i;
  }
  return MODEL_PREFERENCE.length;
}

async function resolveModel(apiKey) {
  // Return cached model if key hasn't changed
  if (resolvedModel && lastKeyUsedForModel === apiKey) return resolvedModel;

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`
    );
    if (!res.ok) throw new Error('Could not fetch models');
    const data = await res.json();
    const models = (data.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => m.name.replace('models/', ''))
      // Exclude vision/embedding/etc — keep text generation models
      .filter(n => n.startsWith('gemini'));

    if (!models.length) throw new Error('No compatible models found for this API key.');

    models.sort((a, b) => scoreModel(a) - scoreModel(b));
    resolvedModel = models[0];
    lastKeyUsedForModel = apiKey;

    // Show resolved model name quietly in the header
    let badge = document.getElementById('model-badge');
    if (!badge) {
      badge = document.createElement('span');
      badge.id = 'model-badge';
      badge.style.cssText = 'font-size:10px;color:var(--muted);letter-spacing:0.06em;background:var(--surface);border:1px solid var(--border);padding:4px 10px;border-radius:99px;white-space:nowrap;';
      document.querySelector('.api-key-wrapper').prepend(badge);
    }
    badge.textContent = resolvedModel;

    return resolvedModel;
  } catch (err) {
    // Fall back to a reasonable default if /models is blocked (e.g. file:// CORS)
    resolvedModel = 'gemini-2.5-flash-preview-04-17';
    lastKeyUsedForModel = apiKey;
    return resolvedModel;
  }
}

function onKeyInput() {
  const key = document.getElementById('api-key-input').value.trim();
  const status = document.getElementById('key-status');
  // Invalidate cached model when key changes
  resolvedModel = null;
  lastKeyUsedForModel = null;
  const badge = document.getElementById('model-badge');
  if (badge) badge.textContent = '';
  if (!key) status.className = 'api-key-status';
  else if (key.length > 20) status.className = 'api-key-status ok';
  else status.className = 'api-key-status err';
}

function getApiKey() {
  return document.getElementById('api-key-input').value.trim();
}

const SYSTEM_PROMPT = `You are a Senior Product Discovery Assistant specializing in Lean Discovery, JTBD (Jobs-to-be-Done), and Continuous Discovery (Teresa Torres style). Your singular mission: stop product teams from building features nobody wants.

## Core Directives
1. **Challenge Assumptions:** For every feature mentioned, surface 2-3 hidden assumptions tagged as [Desirability], [Viability], or [Feasibility].
2. **Hypothesis Formulation:** Convert features into testable hypotheses using:
   - "We believe [User Segment] has [Problem]."
   - "We will solve it by [Feature]."
   - "Evidence of success is [Behavioral Metric]."
3. **Interview Questions:** Strictly follow "The Mom Test" — never ask "Would you use this?" Focus exclusively on past behavior.

## Output Modes

### QUICK CHECK MODE
When user proposes a feature idea, structure reply as:
**THE LEAP OF FAITH** — What must be true for this to work (tag each: Desirability / Viability / Feasibility)
**3 CRITICAL INTERVIEW QUESTIONS** — Past-behavior focused, numbered
**THE SMOKE TEST** — Cheapest possible experiment before writing code

### INTERVIEW GUIDE MODE
When asked for an interview guide:
**CONTEXT & RAPPORT** — Opening questions to build comfort
**PAST EXPERIENCE (Story Phase)** — Draw out real stories
**PAIN POINT DEEP-DIVE** — Probe the frequency, cost, and workarounds
**THE MAGIC WAND** — Uncover the underlying Job-to-be-Done

### HYPOTHESIS LAB MODE
Convert the idea into a formal hypothesis:
**THE HYPOTHESIS** — In "We believe / We will / Evidence of success" format
**ASSUMPTIONS RANKED BY RISK** — Most dangerous first
**FASTEST VALIDATION PATH** — Specific experiment with time + cost estimate

### OPEN CHAT MODE
You have access to real transcripts from Lenny's Podcast — interviews with world-class product leaders (Shreyas Doshi, Marty Cagan, Julie Zhuo, Gibson Biddle, and many more). When relevant transcript context is provided below, ground your advice in those real stories and cite guests by name. Coach freely, always nudging toward evidence over opinions.

## Style
- Be a "Critical Friend": warm but relentlessly skeptical of unvalidated ideas
- Use short, punchy sentences. No padding.
- Always end with a concrete next action the user can take TODAY.
- Use markdown-style formatting: **bold** for key terms, numbered lists for questions, bullet points for assumptions.`;

function getModeInstruction() {
  const modes = {
    'quick-check': 'Use QUICK CHECK MODE for this response.',
    'interview-guide': 'Use INTERVIEW GUIDE MODE for this response.',
    'free': 'Use OPEN CHAT MODE. Coach freely.'
  };
  return modes[currentMode] || '';
}

function setMode(btn) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMode = btn.dataset.mode;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function clearChat() {
  conversationHistory = [];
  const chatArea = document.getElementById('chat-area');
  chatArea.innerHTML = '';
  const welcome = document.createElement('div');
  welcome.className = 'welcome';
  welcome.id = 'welcome';
  welcome.innerHTML = `
    <div class="welcome-eyebrow">Product Discovery Assistant</div>
    <div class="welcome-title">Stop building features<br><span class="highlight">nobody wants.</span></div>
    <div class="welcome-sub">Your Critical Friend for rigorous product discovery. Ground ideas in evidence using JTBD, Lean Discovery, and the Mom Test.</div>`;
  chatArea.appendChild(welcome);
}


// ─── LENNY'S PODCAST RAG ────────────────────────────────────────────────────

const LENNY_RAW = 'https://raw.githubusercontent.com/ChatPRD/lennys-podcast-transcripts/main';
const LENNY_INDEX_URL = LENNY_RAW + '/index/README.md';

// Cache index and fetched transcripts for the session
let lennyIndexCache = null;
let lennyTranscriptCache = {};

// Topic index files mapped to keywords for quick matching
const LENNY_TOPIC_FILES = {
  'product-management': ['product management', 'pm', 'product manager', 'roadmap', 'priorit'],
  'product-market-fit': ['product market fit', 'pmf', 'retention', 'churn', 'traction'],
  'growth-strategy': ['growth', 'acquisition', 'activation', 'viral', 'referral', 'funnel'],
  'leadership': ['leadership', 'manager', 'team', 'hiring', 'culture', 'org'],
  'user-research': ['user research', 'interview', 'discovery', 'customer', 'feedback'],
  'metrics': ['metric', 'kpi', 'north star', 'data', 'analytics', 'measure'],
  'strategy': ['strategy', 'vision', 'positioning', 'competition', 'moat'],
  'design': ['design', 'ux', 'ui', 'prototype', 'usability'],
  'startup': ['startup', 'founder', 'early stage', 'mvp', 'launch', 'idea'],
};

function pickTopicFiles(query) {
  const q = query.toLowerCase();
  const matches = [];
  for (const [file, keywords] of Object.entries(LENNY_TOPIC_FILES)) {
    if (keywords.some(k => q.includes(k))) matches.push(file);
  }
  // Default to product-management if nothing matches
  return matches.length ? matches.slice(0, 2) : ['product-management'];
}

async function fetchLennyIndex(topicFile) {
  const cacheKey = 'index_' + topicFile;
  if (lennyTranscriptCache[cacheKey]) return lennyTranscriptCache[cacheKey];
  try {
    const res = await fetch(`${LENNY_RAW}/index/${topicFile}.md`);
    if (!res.ok) return null;
    const text = await res.text();
    lennyTranscriptCache[cacheKey] = text;
    return text;
  } catch { return null; }
}

// Extract guest folder names from a topic index file
function extractEpisodeSlugs(indexText, limit = 4) {
  if (!indexText) return [];
  // Lines like: - [Guest Name](../episodes/guest-name/transcript.md)
  const matches = [...indexText.matchAll(/episodes\/([^/]+)\/transcript\.md/g)];
  const slugs = [...new Set(matches.map(m => m[1]))];
  return slugs.slice(0, limit);
}

async function fetchTranscriptExcerpt(slug, maxChars = 3000) {
  if (lennyTranscriptCache[slug]) return lennyTranscriptCache[slug];
  try {
    const res = await fetch(`${LENNY_RAW}/episodes/${slug}/transcript.md`);
    if (!res.ok) return null;
    const text = await res.text();
    // Strip YAML frontmatter, keep the first maxChars of actual transcript
    const body = text.replace(/^---[\s\S]*?---/, '').trim();
    // Extract guest name from frontmatter for attribution
    const guestMatch = text.match(/guest:\s*(.+)/);
    const guest = guestMatch ? guestMatch[1].trim() : slug.replace(/-/g, ' ');
    const excerpt = `## From: ${guest}\n\n${body.slice(0, maxChars)}...`;
    lennyTranscriptCache[slug] = excerpt;
    return excerpt;
  } catch { return null; }
}

async function buildLennyContext(userQuery) {
  const topicFiles = pickTopicFiles(userQuery);
  const allSlugs = [];

  for (const topic of topicFiles) {
    const indexText = await fetchLennyIndex(topic);
    const slugs = extractEpisodeSlugs(indexText, 3);
    allSlugs.push(...slugs);
  }

  const uniqueSlugs = [...new Set(allSlugs)].slice(0, 3);
  if (!uniqueSlugs.length) return null;

  const excerpts = await Promise.all(uniqueSlugs.map(s => fetchTranscriptExcerpt(s, 2500)));
  const valid = excerpts.filter(Boolean);
  if (!valid.length) return null;

  return `--- LENNY'S PODCAST CONTEXT ---\nThe following are excerpts from real Lenny's Podcast transcripts relevant to the user's question. Use them to ground your response with real examples and cite guests by name.\n\n${valid.join('\n\n---\n\n')}\n--- END CONTEXT ---`;
}

function updateTypingLabel(id, label) {
  const el = document.getElementById(id);
  if (el) {
    const role = el.querySelector('.msg-role');
    if (role) role.textContent = label;
  }
}

// ─── END LENNY RAG ───────────────────────────────────────────────────────────
async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  const apiKey = getApiKey();
  if (!apiKey) {
    document.getElementById('api-key-input').focus();
    appendErrorMessage('🔑 Please enter your Gemini API key in the field at the top. Get one at <a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com</a>.');
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();
    return;
  }

  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  input.value = '';
  input.style.height = 'auto';

  appendMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

  const typingId = showTyping();
  isLoading = true;
  document.getElementById('send-btn').disabled = true;

  try {
    // In Open Chat mode, enrich with Lenny's Podcast context
    let lennyContext = null;
    if (currentMode === 'free') {
      updateTypingLabel(typingId, 'Searching Lenny\'s archive…');
      lennyContext = await buildLennyContext(text);
      updateTypingLabel(typingId, 'Discovery Assistant');
    }

    const systemPrompt = lennyContext ? SYSTEM_PROMPT + '\n\n' + lennyContext : SYSTEM_PROMPT;

    const messages = conversationHistory.map((m, i) => ({
      role: m.role,
      content: (m.role === 'user' && i === conversationHistory.length - 1)
        ? `[${getModeInstruction()}]\n\n${m.content}`
        : m.content
    }));

    const model = await resolveModel(apiKey);
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: messages.map(m => ({
          role: m.role === 'assistant' ? 'model' : 'user',
          parts: [{ text: m.content }]
        })),
        generationConfig: { maxOutputTokens: currentMode === 'free' ? 3000 : 2048 }
      })
    });

    const data = await res.json();

    if (!res.ok) {
      if (res.status === 400 || res.status === 403) document.getElementById('key-status').className = 'api-key-status err';
      throw new Error(data?.error?.message || `Error ${res.status}`);
    }

    document.getElementById('key-status').className = 'api-key-status ok';
    const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!reply) throw new Error('Empty response from API.');

    removeTyping(typingId);
    appendMessage('assistant', reply);
    conversationHistory.push({ role: 'assistant', content: reply });

  } catch (err) {
    removeTyping(typingId);
    appendErrorMessage(`⚠️ ${err.message}`);
    conversationHistory.pop();
  }

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
}

function appendErrorMessage(msg) {
  const chatArea = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = `<div class="msg-role">Discovery Assistant</div><div class="msg-bubble"><div class="error-banner">${msg}</div></div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  const id = 'typing-' + Date.now();
  const chatArea = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = id;
  div.innerHTML = `
    <div class="msg-role">Discovery Assistant</div>
    <div class="msg-bubble">
      <div class="typing-indicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return id;
}

function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function formatAssistantText(text) {
  let html = text
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/^(\d+)\. (.+)$/gm, '<div class="list-item"><span class="list-num">$1.</span><span>$2</span></div>')
    .replace(/^[-•] (.+)$/gm, '<div class="list-item"><span class="list-num">·</span><span>$1</span></div>')
    .replace(/\[Desirability\]/g, '<span class="tag desirability">Desirability</span>')
    .replace(/\[Viability\]/g, '<span class="tag viability">Viability</span>')
    .replace(/\[Feasibility\]/g, '<span class="tag feasibility">Feasibility</span>')
    .replace(/^(THE [A-Z &]+|CONTEXT & RAPPORT|PAST EXPERIENCE.*|PAIN POINT.*|THE MAGIC WAND|ASSUMPTIONS.*|FASTEST.*|THE HYPOTHESIS)$/gm,
      '<div class="block-title">$1</div>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
  return html;
}

function appendMessage(role, text) {
  const chatArea = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const label = role === 'user' ? 'You' : 'Discovery Assistant';
  const content = role === 'assistant' ? formatAssistantText(text) : text.replace(/\n/g, '<br>');
  div.innerHTML = `<div class="msg-role">${label}</div><div class="msg-bubble">${content}</div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}
</script>
